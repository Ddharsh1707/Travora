# Temporary: find why the AI assistant fails. Prints Groq's reply status and recent
# ai-assistant function logs. Never prints keys.
name: AI diagnose
on:
  push:
    branches: [claude/project-thread-14kund]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: lbxqiifssfgpfqgdvbmh
    steps:
      - name: Groq models available to this key
        run: |
          curl -sS https://api.groq.com/openai/v1/models -H "Authorization: Bearer $GROQ_API_KEY" -o models.json -w "HTTP %{http_code}\n"
          jq -r '.data[]?.id' models.json | sort || head -c 500 models.json
      - name: Groq test call with a tool (gpt-oss-120b)
        run: |
          cat > body.json <<'J'
          {"model":"openai/gpt-oss-120b","temperature":0.1,"max_tokens":300,"reasoning_effort":"low","tool_choice":"auto",
           "messages":[{"role":"system","content":"You help with company data."},{"role":"user","content":"How many employees do we have?"}],
           "tools":[{"type":"function","function":{"name":"company_overview","description":"Counts of employees and trips","parameters":{"type":"object","properties":{},"additionalProperties":false}}}]}
          J
          curl -sS https://api.groq.com/openai/v1/chat/completions -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" -d @body.json -w "\nHTTP %{http_code}\n" | head -c 1500
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replay the assistant's Groq rounds with the real tools
        run: |
          cp supabase/functions/_shared/assistantTools.ts "$RUNNER_TEMP/tools.ts"
          TOOLS_TS="$RUNNER_TEMP/tools.ts" node --experimental-strip-types .github/diagnose/groq-loop.mjs
      - name: Live functions and auth setup (no secrets printed)
        continue-on-error: true
        run: |
          api=https://api.supabase.com/v1/projects/$REF
          echo "== functions"; curl -sS "$api/functions" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -c '.[] | {slug, status, version, verify_jwt, updated_at}'
          echo "== api key kinds"; curl -sS "$api/api-keys?reveal=false" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -c '.[] | {name, type}'
          echo "== jwt signing keys"; curl -sS "$api/config/auth/signing-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -c '(.keys // .)[]? | {algorithm, status}' || true
          anon=$(curl -sS "$api/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[] | select(.name=="anon" or .type=="publishable")][0].api_key')
          echo "::add-mask::$anon"
          fn=https://$REF.supabase.co/functions/v1/ai-assistant
          echo "== call with no auth";   curl -sS -X POST "$fn" -H "Content-Type: application/json" -d '{"question":"hi"}' -w "\nHTTP %{http_code}\n" | head -c 400
          echo "== call with anon key";  curl -sS -X POST "$fn" -H "Content-Type: application/json" -H "apikey: $anon" -H "Authorization: Bearer $anon" -d '{"question":"hi"}' -w "\nHTTP %{http_code}\n" | head -c 400
          echo "== preflight"; curl -sS -X OPTIONS "$fn" -H "Origin: https://main.d27refhdsen811.amplifyapp.com" -H "Access-Control-Request-Method: POST" -D - -o /dev/null | head -20
      - name: Recent ai-assistant logs (last 2 hours)
        continue-on-error: true
        run: |
          start=$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:%SZ); end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sql="select timestamp, event_message, metadata from function_logs order by timestamp desc limit 60"
          curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs.all" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$sql" --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" \
            -o logs.json -w "HTTP %{http_code}\n"
          jq -r '.result[]? | "\(.timestamp) \(.event_message)"' logs.json | head -80 || head -c 2000 logs.json
          jq -r '.error? // empty' logs.json | head -c 1000
      - name: Recent ai-assistant HTTP responses
        run: |
          start=$(date -u -d '-2 hours' +%Y-%m-%dT%H:%M:%SZ); end=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          sql="select timestamp, event_message from function_edge_logs order by timestamp desc limit 30"
          curl -sS -G "https://api.supabase.com/v1/projects/$REF/analytics/endpoints/logs.all" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --data-urlencode "sql=$sql" --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" -o edge.json -w "HTTP %{http_code}\n"
          jq -r '.result[]? | "\(.timestamp) \(.event_message)"' edge.json | head -40 || head -c 1500 edge.json
