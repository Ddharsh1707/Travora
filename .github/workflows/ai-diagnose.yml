# Temporary: check which website origins the functions allow (CORS). Prints no secret values.
name: AI diagnose
on:
  push:
    branches: [claude/project-thread-14kund]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: lbxqiifssfgpfqgdvbmh
    steps:
      - name: Preflight from each known site
        run: |
          fn=https://$REF.supabase.co/functions/v1/ai-assistant
          for o in https://main.d27refhdsen811.amplifyapp.com https://travora-ashy.vercel.app http://localhost:3000; do
            echo "== $o"; curl -sS -X OPTIONS "$fn" -H "Origin: $o" -H "Access-Control-Request-Method: POST" -D - -o /dev/null | grep -i "access-control-allow-origin" || echo "   (origin NOT allowed)"
          done
      - name: Which secrets exist, and does ALLOWED_ORIGINS match a guess
        run: |
          curl -sS "https://api.supabase.com/v1/projects/$REF/secrets" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > s.json
          jq -r '.[].name' s.json | sort
          digest=$(jq -r '.[] | select(.name=="ALLOWED_ORIGINS") | .value' s.json)
          for g in "https://travora-ashy.vercel.app" "https://travora-ashy.vercel.app,http://localhost:3000" "http://localhost:3000" "https://main.d27refhdsen811.amplifyapp.com" "https://main.d27refhdsen811.amplifyapp.com,https://travora-ashy.vercel.app"; do
            [ "$(printf %s "$g" | sha256sum | cut -d' ' -f1)" = "$digest" ] && echo "ALLOWED_ORIGINS is exactly: $g"
          done; echo done
      - name: Amplify site bundle
        continue-on-error: true
        run: |
          base=https://main.d27refhdsen811.amplifyapp.com
          curl -sS "$base/" -o i.html -w "index HTTP %{http_code}\n"
          for js in $(grep -o 'src="/[^"]*\.js"' i.html | cut -d'"' -f2); do curl -sS "$base$js" -o b.js; echo "$js: $(wc -c < b.js) bytes"; grep -o 'https://[a-z0-9]*\.supabase\.co' b.js | sort -u; grep -c "before the function runs\|gateway" b.js || true; done
