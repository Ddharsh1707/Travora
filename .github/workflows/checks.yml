# Runs every check on each proposed change (pull request) and on every push to main.
# Branch protection on main should require all four jobs below to pass before merging.
# See docs/BRANCH_PROTECTION.md for the settings to switch on.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: App tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Known-vulnerable packages (fails on critical)
        run: pnpm audit --prod --audit-level critical

  database:
    name: Database security (RLS tests)
    runs-on: ubuntu-24.04 # ships with PostgreSQL 16; the script starts a throwaway copy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply all migrations and run the RLS test suite
        run: bash supabase/tests/run_local.sh

  functions:
    name: Edge Functions (Deno type check)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Checked from a copy outside the repo: inside it, Deno sees the root package.json
      # and expects the npm packages in node_modules instead of fetching them itself,
      # which is not how Supabase runs these functions.
      - name: Type check Edge Functions
        run: |
          cp -r supabase/functions "$RUNNER_TEMP/functions"
          cd "$RUNNER_TEMP/functions"
          deno check */index.ts

  migrations:
    name: Migrations (no edits to applied files, new files sort last)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check migration files against the base branch
        run: bash scripts/check-migrations.sh "origin/${{ github.base_ref }}"
