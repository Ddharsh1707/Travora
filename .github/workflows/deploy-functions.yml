# Puts the AI keys into Supabase and deploys the Edge Functions (admin-users, ai-assistant,
# document-extract) to the live Supabase project, straight from GitHub. No terminal needed.
#
# Runs on its own when a change to supabase/functions reaches main, and by hand from
# Actions -> "Deploy Supabase functions" -> "Run workflow".
#
# Repository secrets it reads (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  required. A personal access token from supabase.com/dashboard/account/tokens
#   GROQ_API_KEY           optional. Saved into Supabase as the AI assistant's key (console.groq.com/keys)
#   GEMINI_API_KEY         optional. Backup AI key, used only if Groq is busy
#   SUPABASE_PROJECT_REF   optional. Defaults to the live project below
# Keys are only ever passed through GitHub's encrypted secrets; none are stored in this repo.
# See docs/DEPLOY_FUNCTIONS.md for the click-by-click setup.
name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Edge Functions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # The project ref is part of the public Supabase URL, so a default here is not a secret.
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_REF || 'lbxqiifssfgpfqgdvbmh' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check the Supabase token is set
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Nothing deployed::Add the SUPABASE_ACCESS_TOKEN repository secret, then run this workflow again (see docs/DEPLOY_FUNCTIONS.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ready == 'true'
        with:
          version: latest

      - name: Save the AI keys in Supabase
        if: steps.token.outputs.ready == 'true'
        run: |
          # Written to a private temp file rather than the command line, so keys never show in logs.
          env_file="$RUNNER_TEMP/function-secrets.env"
          umask 077
          : > "$env_file"
          [ -n "$GROQ_API_KEY" ] && printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> "$env_file"
          [ -n "$GEMINI_API_KEY" ] && printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" >> "$env_file"
          if [ -s "$env_file" ]; then
            supabase secrets set --env-file "$env_file" --project-ref "$PROJECT_REF"
            echo "Saved: $(cut -d= -f1 "$env_file" | paste -sd, -)"
          else
            echo "No GROQ_API_KEY or GEMINI_API_KEY secret in GitHub; leaving the keys already in Supabase as they are."
          fi
          rm -f "$env_file"

      - name: Deploy the functions
        if: steps.token.outputs.ready == 'true'
        run: |
          # Deployed from a copy outside the repo, for the same reason as the Deno check in
          # checks.yml: the root package.json would make Deno look for npm packages in
          # node_modules instead of fetching them itself.
          work="$RUNNER_TEMP/deploy"
          mkdir -p "$work"
          cp -r supabase "$work/supabase"
          cd "$work"
          for fn in admin-users ai-assistant document-extract; do
            echo "::group::Deploy $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF"
            echo "::endgroup::"
          done

      - name: Summary
        if: steps.token.outputs.ready == 'true'
        run: |
          {
            echo "### Supabase functions deployed"
            echo "Project: \`$PROJECT_REF\`"
            echo "- admin-users, ai-assistant, document-extract"
            [ -n "$GROQ_API_KEY" ] && echo "- Groq key saved in Supabase"
            [ -n "$GEMINI_API_KEY" ] && echo "- Gemini backup key saved in Supabase"
            true
          } >> "$GITHUB_STEP_SUMMARY"
