# AWS Amplify Hosting build settings for the Travora web app.
# Amplify reads this file from the repo root when you connect the repo.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Vite 7 needs Node 20.19 or newer.
        - nvm install 22 && nvm use 22
        - corepack enable
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        # Only the static site is needed. The Node server in server/ is not deployed.
        - pnpm exec vite build
  artifacts:
    baseDirectory: dist/public
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
