spring.application.name=traveldesk-backend-test

# Use in-memory H2 database for test runs
spring.datasource.url=jdbc:h2:mem:traveldesk_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Test JWT secret (>= 32 bytes)
app.jwt.secret=test-super-secret-jwt-signing-key-for-unit-testing-32-bytes-min!
app.cors.allowed-origins=http://localhost:3000

logging.level.org.springframework=WARN
logging.level.org.springframework.security=DEBUG
logging.level.com.traveldesk.backend=INFO

# Trapple AI Test Configuration
ai.provider=mock
ai.model=mock-model
ai.api-key=test-ai-key
ai.base-url=http://localhost:8080/mock-ai
ai.max-output-tokens=1024
ai.timeout-seconds=5
ai.enabled=true
ai.max-requests-per-user=50
ai.monthly-budget=100.00

