# Supabase CLI settings (local development + values to mirror in the hosted
# project's dashboard). No secrets belong in this file.
project_id = "trapple"

[api]
# Only `public` is reachable over the REST API. Helper functions live in
# `private`, which is deliberately not listed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://travora-ashy.vercel.app/login", "http://localhost:3000/login"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Invite-only: employees cannot create their own accounts.
enable_signup = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = false
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150
email_sent = 2

[storage]
file_size_limit = "10MiB"

[functions.admin-users]
verify_jwt = true
