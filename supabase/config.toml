# Supabase CLI settings (local development + values to mirror in the hosted
# project's dashboard). No secrets belong in this file.
project_id = "trapple"

[api]
# Only `public` is reachable over the REST API. Helper functions live in
# `private`, which is deliberately not listed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://main.d27refhdsen811.amplifyapp.com", "https://main.d27refhdsen811.amplifyapp.com/login", "https://travora-ashy.vercel.app/login", "http://localhost:3000", "http://localhost:3000/login"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# People can create their own account from the login page. New accounts
# only get the 'employee' role (see migration 20261106000600_self_signup.sql).
enable_signup = true
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

[auth.email]
enable_signup = true
# Must stay true: sign-ups are only linked once the email is confirmed.
enable_confirmations = true
secure_password_change = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150
email_sent = 2

[storage]
file_size_limit = "10MiB"

[functions.admin-users]
verify_jwt = true
